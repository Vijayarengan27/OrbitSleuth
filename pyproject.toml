[project]
name = "orbitsleuth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vijayarengan27", email = "vijayarengan27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sgp4>=2.27",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
orbitsleuth = "orbitsleuth:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
